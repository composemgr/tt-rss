name: tt-rss
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/tt-rss/tt-rss:latest
    container_name: tt-rss-app
    hostname: tt-rss-app
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      CONTAINER_NAME: tt-rss-app
      TZ: ${TZ:-America/New_York}
      TTRSS_DB_TYPE: pgsql
      TTRSS_DB_HOST: tt-rss-db
      TTRSS_DB_PORT: '5432'
      TTRSS_DB_NAME: ${DB_CREATE_DATABASE_NAME:-ttrss}
      TTRSS_DB_USER: ${DB_USER_NAME:-ttrss}
      TTRSS_DB_PASS: ${DB_USER_PASS:-replace-with-a-random-password}
      TTRSS_SELF_URL_PATH: https://${BASE_HOST_NAME:-$HOSTNAME}/
      TTRSS_PHP_EXECUTABLE: /usr/bin/php83
      ADMIN_USER_PASS: ${APP_ADMIN_PASS:-replace-with-a-random-password}
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '9000']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/tt-rss/app:/var/www/html:z'
    depends_on:
      tt-rss-db:
        condition: service_healthy
    networks:
      - tt-rss

  updater:
    image: ghcr.io/tt-rss/tt-rss:latest
    container_name: tt-rss-updater
    hostname: tt-rss-updater
    restart: always
    pull_policy: always
    logging: *default-logging
    command: /opt/tt-rss/updater.sh
    environment:
      CONTAINER_NAME: tt-rss-updater
      TZ: ${TZ:-America/New_York}
      TTRSS_DB_TYPE: pgsql
      TTRSS_DB_HOST: tt-rss-db
      TTRSS_DB_PORT: '5432'
      TTRSS_DB_NAME: ${DB_CREATE_DATABASE_NAME:-ttrss}
      TTRSS_DB_USER: ${DB_USER_NAME:-ttrss}
      TTRSS_DB_PASS: ${DB_USER_PASS:-replace-with-a-random-password}
      TTRSS_SELF_URL_PATH: https://${BASE_HOST_NAME:-$HOSTNAME}/
      TTRSS_PHP_EXECUTABLE: /usr/bin/php83
      ADMIN_USER_PASS: ${APP_ADMIN_PASS:-replace-with-a-random-password}
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '9000']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/tt-rss/app:/var/www/html:z'
    depends_on:
      - app
    networks:
      - tt-rss

  web:
    image: ghcr.io/tt-rss/tt-rss-web-nginx:latest
    container_name: tt-rss-web
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: tt-rss-web
      APP_UPSTREAM: app
      APP_BASE: ''
    healthcheck:
      test: ['CMD', 'sh', '-c', 'curl --fail --silent --show-error "http://localhost${APP_BASE}/index.php" || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/tt-rss/app:/var/www/html:ro,z'
    depends_on:
      - app
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://tt-rss-web:80'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - tt-rss
      - cloudflare

  tt-rss-db:
    image: postgres:latest
    container_name: tt-rss-db
    hostname: tt-rss-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: tt-rss-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-ttrss}
      POSTGRES_USER: ${DB_USER_NAME:-ttrss}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/postgres/ttrss:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tt-rss

networks:
  tt-rss:
    name: tt-rss
    external: false
  cloudflare:
    external: true
